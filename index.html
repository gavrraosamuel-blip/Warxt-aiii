
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160d20">
<title>Warxt AI 💜</title>
<style>
:root{--bg:#130b1b;--panel:#241631;--purple:#8050aa;--pink:#f0add4;--text:#fff5ff;--muted:#cbbbd6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#392044,var(--bg) 70%);color:var(--text);font:16px system-ui,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer;color:white;background:linear-gradient(135deg,#8050aa,#432650);border:1px solid #966bb4;border-radius:12px;padding:11px}
button:disabled{opacity:.5}
header{position:sticky;top:0;z-index:5;background:#160e20ed;padding:13px;border-bottom:1px solid #563768}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#f1a9d1,#8753b4);font-size:25px}
h1{font-size:20px;margin:0}
header p{margin:2px 0;color:var(--muted);font-size:12px}
nav{display:flex;gap:7px;overflow:auto;margin-top:12px}
nav button{white-space:nowrap}
main{max-width:1000px;margin:auto;padding:14px}
.screen{display:none}
.screen.active{display:block}
.panel,.hero{background:#21152df0;border:1px solid #63417b;border-radius:17px;padding:16px;margin-bottom:13px}
h2{font-size:20px;margin:0 0 10px}
p{line-height:1.55}
.muted{color:var(--muted)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.menu-card{min-height:105px;text-align:left;font-weight:bold}
.menu-card span{display:block;font-size:28px;margin-bottom:7px}
.field{width:100%;padding:12px;margin:7px 0;border:1px solid #69477e;border-radius:11px;color:white;background:#140e1c}
.character-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.character{display:flex;align-items:center;gap:9px;text-align:left;min-width:0;background:#291c37;padding:9px}
.avatar{width:54px;height:62px;flex-shrink:0;display:grid;place-items:center;border-radius:12px;font-size:28px;background:linear-gradient(140deg,#e8a8d0,#7650a6);border:1px solid #ffffff44}
.character strong{display:block;font-size:14px}
.character small{display:block;font-size:11px;color:#d4c4df}
.story-box{background:#130d1a;border:1px solid #63417b;border-radius:14px;padding:15px;line-height:1.7}
.story-choice{width:100%;margin-top:9px;text-align:left}
.chat-head{display:flex;align-items:center;gap:12px;margin:12px 0}
.chat-log{height:42vh;min-height:250px;overflow:auto;background:#130d1a;border:1px solid #513665;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:88%;padding:11px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#30203d}
.user{align-self:flex-end;background:#68438b}
.compose{display:flex;gap:7px;margin-top:9px}
.compose textarea{min-width:0;flex:1;resize:vertical;background:#140e1c;color:white;border:1px solid #69477e;border-radius:12px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{flex:1}
.notice{background:#2a1b38;padding:10px;border-radius:10px;color:#d9c8e4;font-size:12px;margin-top:10px}
@media(min-width:700px){main{padding:24px}.character-grid{grid-template-columns:repeat(3,1fr)}.menu-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="logo">💜</div><div><h1>Warxt AI</h1><p>Literature Club · Chat, romance e histórias</p></div></div>
<nav>
<button onclick="screen('home')">🏠 Início</button>
<button onclick="screen('story')">📖 História</button>
<button onclick="screen('characters')">🎭 Personagens</button>
<button onclick="screen('chat')">💬 Chat</button>
</nav>
</header>

<main>
<section id="home" class="screen active">
<div class="hero">
<h2>Bem-vindo ao clube, Yrazi! 🌸</h2>
<p>Seu universo, seus personagens e suas escolhas.</p>
<p class="muted" id="total"></p>
</div>
<div class="menu-grid">
<button class="menu-card" onclick="screen('story')"><span>📖</span>Visual Novel</button>
<button class="menu-card" onclick="screen('chat')"><span>💬</span>Chat livre</button>
<button class="menu-card" onclick="groupChat()"><span>👥</span>Chat em grupo</button>
<button class="menu-card" onclick="screen('characters')"><span>🎨</span>Elenco</button>
</div>
<div class="panel"><h2>🌷 Conversa rápida</h2><p>Sayori está esperando por você!</p><button onclick="choose('Sayori');screen('chat')">Conversar com Sayori 💙</button></div>
</section>

<section id="characters" class="screen">
<button onclick="screen('home')">← Menu</button>
<div class="panel"><h2>🎭 Personagens</h2><input id="search" class="field" placeholder="Buscar personagem..." oninput="renderCharacters()"><div id="roster" class="character-grid"></div></div>
</section>

<section id="chat" class="screen">
<button onclick="screen('home')">← Menu</button>
<div class="panel">
<div class="chat-head"><div class="avatar" id="chatAvatar">🌸</div><div><h2 id="chatName">Sayori</h2><div class="muted" id="chatDescription"></div></div></div>
<div id="messages" class="chat-log"></div>
<div class="compose"><textarea id="message" rows="2" placeholder="Escreva sua mensagem..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button id="send" onclick="send()">Enviar ➤</button></div>
<div class="row"><button onclick="clearChat()">Limpar conversa</button><button onclick="groupChat()">Modo grupo 👥</button></div>
<div class="notice" id="status">Pronto para conversar.</div>
</div>
</section>

<section id="story" class="screen">
<button onclick="screen('home')">← Menu</button>
<div class="hero"><h2>📚 O Clube de Literatura</h2><p class="muted">Dia 1 · Depois das aulas</p></div>
<div class="panel"><div class="story-box" id="storyText"></div><div id="choices"></div></div>
</section>
</main>

let selected=C[0],groupMode=false,history=[];

function screen(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
function addMessage(type,text){
 const log=document.getElementById("messages");
 const bubble=document.createElement("div");
 bubble.className="bubble "+type;
 bubble.textContent=text;
 log.appendChild(bubble);
 log.scrollTop=log.scrollHeight;
}
function choose(name){
 selected=C.find(c=>c[0]===name)||C[0];
 groupMode=false;history=[];
 document.getElementById("chatName").textContent=selected[0];
 document.getElementById("chatDescription").textContent=selected[1];
 document.getElementById("chatAvatar").textContent=selected[2];
 document.getElementById("messages").innerHTML="";
 addMessage("bot",`Oi, Yrazi! 💜 Eu sou ${selected[0]}. Vamos conversar?`);
 document.getElementById("status").textContent="Pronto para conversar.";
}
function groupChat(){
 groupMode=true;selected=null;history=[];
 screen("chat");
 document.getElementById("chatName").textContent="Grupo Warxt";
 document.getElementById("chatDescription").textContent="Conversa com o elenco";
 document.getElementById("chatAvatar").textContent="👥";
 document.getElementById("messages").innerHTML="";
 addMessage("bot","Sayori: Yrazi! Você chegou! 💙\nNatsuki: Hmph! Não pense que estávamos esperando você!\nMonika: Bem-vindo ao clube! 🌸");
 document.getElementById("status").textContent="Modo grupo selecionado.";
}
function renderCharacters(){
 const q=(document.getElementById("search").value||"").toLowerCase();
 const roster=document.getElementById("roster");
 roster.innerHTML="";
 C.filter(c=>(c[0]+" "+c[1]).toLowerCase().includes(q)).forEach(c=>{
  const btn=document.createElement("button");
  btn.className="character";
  const avatar=document.createElement("span");
  avatar.className="avatar";avatar.textContent=c[2];
  const info=document.createElement("span");
  const name=document.createElement("strong");name.textContent=c[0];
  const desc=document.createElement("small");desc.textContent=c[1];
  info.append(name,desc);btn.append(avatar,info);
  btn.onclick=()=>{choose(c[0]);screen("chat");};
  roster.appendChild(btn);
 });
}
function clearChat(){
 history=[];
 document.getElementById("messages").innerHTML="";
 addMessage("bot","Vamos começar uma nova conversa! 💜");
}
async function send(){
 const input=document.getElementById("message");
 const text=input.value.trim();
 if(!text)return;
 input.value="";
 addMessage("user",text);
 const button=document.getElementById("send");
 const status=document.getElementById("status");
 button.disabled=true;status.textContent="Pensando... 💭";
 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    character:groupMode?"Grupo Warxt":selected[0],
    personality:groupMode?C.map(c=>c[0]+": "+c[1]).join("\n"):selected[1],
    history:history
   })
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Erro ao conversar com a IA.");
  const answer=data.reply||data.text||"Não consegui gerar uma resposta.";
  addMessage("bot",answer);
  history.push({role:"user",content:text},{role:"assistant",content:answer});
  history=history.slice(-20);
  status.textContent="Resposta recebida.";
 }catch(error){
  addMessage("bot","Não consegui conectar à IA agora. Confira se o servidor Gemini está configurado. 💜");
  status.textContent=error.message;
 }finally{button.disabled=false;}
}

const scenes=[
 {text:"O sinal toca. Yrazi entra na sala do clube de literatura. Sayori corre até ele, sorrindo. Natsuki observa de braços cruzados, enquanto Monika prepara uma atividade.",choices:[["Conversar com Sayori 💙","Sayori"],["Provocar Natsuki 😤","Natsuki"],["Falar com Monika 🌸","Monika"]]},
 {text:"O clube fica agitado quando Yrazi chega. Sayori derruba alguns livros sem querer. Yuri começa a ajudá-la, e Natsuki finge não estar preocupada.",choices:[["Ajudar Sayori","Sayori"],["Ajudar Yuri","Yuri"],["Conversar com Natsuki","Natsuki"]]},
 {text:"Monika propõe uma atividade de poesia. Cada pessoa deve escrever algo que represente seus sentimentos. Sayori olha para Yrazi e sorri timidamente.",choices:[["Escrever com Sayori","Sayori"],["Ler com Yuri","Yuri"],["Perguntar a Monika sobre a atividade","Monika"]]}
];
let sceneIndex=0;
function showStory(){
 const scene=scenes[sceneIndex%scenes.length];
 document.getElementById("storyText").textContent=scene.text;
 const choices=document.getElementById("choices");choices.innerHTML="";
 scene.choices.forEach(([label,name])=>{
  const btn=document.createElement("button");
  btn.className="story-choice";btn.textContent=label;
  btn.onclick=()=>{choose(name);screen("chat");};
  choices.appendChild(btn);
 });
 const next=document.createElement("button");
 next.className="story-choice";next.textContent="Continuar história ➜";
 next.onclick=()=>{sceneIndex++;showStory();};
 choices.appendChild(next);
}
document.getElementById("total").textContent=C.length+" personagens cadastrados";
renderCharacters();showStory();choose("Sayori");
</script>

</html>
