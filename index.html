<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160d27">
<title>Warxt AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10091b;color:#f8f3ff;font-family:Arial,sans-serif}
header{background:#241438;padding:20px;text-align:center;border-bottom:2px solid #9b6bff}
header h1{margin:0;color:#c3a4ff}
main{padding:16px;max-width:600px;margin:auto}
.card{background:#211532;border:1px solid #63438a;border-radius:15px;padding:15px;margin:12px 0}
button{background:#9b6bff;color:#160d27;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#180f25;color:white;border:1px solid #63438a;border-radius:9px}
textarea{min-height:90px}
#chat{display:none}
.msg{background:#332047;padding:12px;border-radius:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#65409a;text-align:right}
small{color:#c7b5dc}
</style>
</head>
<body>
<header>
<h1>💜 Warxt AI</h1>
<p>Seu universo. Suas conversas.</p>
</header>
<main>
<section id="home">
<div class="card">
<h2>Olá! Bem-vindo ao Warxt AI</h2>
<p>Crie personagens e converse com eles.</p>
</div>
<h3>Seus personagens</h3>
<div id="lista"></div>
<button onclick="novo()">＋ Criar personagem</button>
</section>

<section id="editor" style="display:none">
<h2>Novo personagem</h2>
<label>Nome</label>
<input id="nome" placeholder="Nome do personagem">
<label>Personalidade (até 100.000 caracteres)</label>
<textarea id="personalidade" maxlength="100000" placeholder="Descreva a personalidade..."></textarea>
<label>Primeira mensagem (até 100.000 caracteres)</label>
<textarea id="primeira" maxlength="100000" placeholder="Como a conversa começa?"></textarea>
<button onclick="salvar()">Salvar personagem</button>
<button onclick="inicio()">Voltar</button>
</section>

<section id="chat" class="card">
<h2 id="titulo"></h2>
<div id="mensagens"></div>
<textarea id="texto" placeholder="Escreva sua mensagem..."></textarea>
<button onclick="enviar()">Enviar</button>
<button onclick="inicio()">Início</button>
</section>
<p><small>Versão inicial: a IA Gemini será conectada na próxima etapa.</small></p>
</main>
<script>
let personagens=[];
let atual=-1;
try{personagens=JSON.parse(localStorage.getItem("warxt_personagens")||"[]")}catch(e){personagens=[]}
function guardar(){localStorage.setItem("warxt_personagens",JSON.stringify(personagens))}
function mostrarLista(){
 document.getElementById("lista").innerHTML="";
 personagens.forEach((p,i)=>{
  let b=document.createElement("button");
  b.textContent="✨ "+p.nome;
  b.style.margin="5px";
  b.onclick=()=>abrir(i);
  document.getElementById("lista").appendChild(b);
 });
}
function esconder(){
 ["home","editor","chat"].forEach(id=>document.getElementById(id).style.display="none");
}
function inicio(){esconder();document.getElementById("home").style.display="block";mostrarLista()}
function novo(){esconder();document.getElementById("editor").style.display="block";document.getElementById("nome").value="";document.getElementById("personalidade").value="";document.getElementById("primeira").value=""}
function salvar(){
 let nome=document.getElementById("nome").value.trim();
 if(!nome){alert("Digite o nome do personagem.");return}
 personagens.push({nome:nome,personalidade:document.getElementById("personalidade").value,primeira:document.getElementById("primeira").value,mensagens:[]});
 let p=personagens[personagens.length-1];
 if(p.primeira)p.mensagens.push({de:"ai",texto:p.primeira});
 guardar();atual=personagens.length-1;abrir(atual)
}
function abrir(i){
 atual=i;esconder();document.getElementById("chat").style.display="block";
 document.getElementById("titulo").textContent=personagens[i].nome;
 renderizar()
}
function renderizar(){
 let area=document.getElementById("mensagens");area.innerHTML="";
 personagens[atual].mensagens.forEach(m=>{
  let d=document.createElement("div");d.className="msg "+(m.de==="voce"?"user":"");
  d.textContent=(m.de==="voce"?"Você: ":"")+m.texto;area.appendChild(d)
 })
}
function enviar(){
 let campo=document.getElementById("texto"),t=campo.value.trim();
 if(!t||atual<0)return;
 personagens[atual].mensagens.push({de:"voce",texto:t});
 personagens[atual].mensagens.push({de:"ai",texto:"Sua mensagem foi salva! A conexão com a Gemini ainda será configurada."});
 campo.value="";guardar();renderizar()
}
mostrarLista();
</script>
</body>
</html>
